function go(i){cur=i;document.querySelectorAll("section").forEach((s,j)=>s.classList.toggle("on",j==i));rNav();if(i==4)rCh();scrollTo(0,0)}
function rNav(){$("nv").innerHTML=D.n[li].map((t,i)=>`<button class="${i==cur?"on":""}" onclick="go(${i})">${t}</button>`).join("")}

/* 1 衰弱AI初筛 */
function assess(init){
 const s=+$("a_s").value,d=+$("a_d").value,g=+$("a_g").value,v=+$("a_v").value,b=+$("a_b").value;
 const sc=(g<18?2:g<26?1:0)+(v<.6?2:v<.8?1:0)+(b<5?2:b<10?1:0)+(s>=160||d>=100?1:0);
 lv=sc<=2?0:sc<=4?1:2;S.sc=sc;S.src=0;S.note="";
 rx=RXM[lv].map(m=>({m,i:lv==0?1:0}));
 if(init!==1)H.push({d:dt(0),g,b});
 all();
}
function rAres(){const col=["#1b8a4b","#e08a00","#d32f2f"][lv];
 $("ares").innerHTML=`<div class="card" style="border-left:12px solid ${col}"><h3>${L("sc")}: ${S.sc}/7 → <span style="color:${col}">${LV()}</span></h3><p>${L("why")}</p><button onclick="go(1)">${D.n[li][1]} ▶</button></div>`}

/* 2 处方 */
function rRx(){$("rx").innerHTML=`<p>${L("lvl")}: <b>${LV()}</b> · ${L("d_src")}: <b>${L(S.src?"src_dr":"src_ai")}</b></p><table><tr><th></th><th>${L("min")}</th><th>${L("int_")}</th></tr>${rx.map((r,i)=>`<tr><td>${D.p[li][i]}</td><td>${r.m}</td><td>${D.int[li][r.i]}</td></tr>`).join("")}</table>${S.note?`<p>📝 ${esc(S.note)}</p>`:""}<button onclick="go(2)">${D.n[li][2]} ▶</button>`}

/* 5 血压联动自适应引擎 */
function plan(){const s=+$("p_s").value,d=+$("p_d").value;return s>=180||d>=110?{m:"ban",f:0}:s>=160||d>=100?{m:"seat",f:.6}:s>=140||d>=90?{m:"low",f:.8}:{m:"up",f:1.2}}
function rPlan(){const p=plan(),e=$("pl");e.textContent=L("m_"+p.m);e.className=p.m=="up"?"ok":p.m=="low"?"":"bad";
 const x=rx[$("ex").value]||{m:10,i:0};tgt=Math.max(1,Math.round(x.m*p.f));
 $("tg").textContent=L("target")+": "+tgt+" "+L("min")+" · "+D.int[li][Math.min(2,x.i+(p.m=="up"?1:0))]}

/* 3 摄像头姿态训练 */
function tip(t,b){const e=$("tp");e.textContent=t;e.className=b?"bad":"ok";if(b&&Date.now()-lastSay>9000){lastSay=Date.now();say(t)}}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=["zh-CN","en-US","ko-KR"][li];speechSynthesis.speak(u)}catch(e){}}
function tile(i,t,bad){const e=$("m"+i);e.textContent=t;e.className=bad?"bad":"ok"}
function upd(){$("pa").textContent=L(paused?"resume":"pause")}
function pa(){if(!run)return;paused=!paused;if(!paused){fc=0;ph=null;$("fb").style.display="none"}upd()}
function fall(){if(paused)return;paused=1;fc=0;S.f++;$("fb").style.display="block";$("fb").textContent=L("fall");say(L("fsp"));upd();rDr()}

function onRes(r){
 const c=$("cv"),x=c.getContext("2d"),W=r.image.width,Hh=r.image.height;
 if(c.width!=W)c.width=W;if(c.height!=Hh)c.height=Hh;
 x.drawImage(r.image,0,0,W,Hh);
 const p=r.poseLandmarks;if(!p){if(!paused)tip(L("nobody"),1);return}
 x.lineWidth=4;x.strokeStyle="#19e3f5";
 (window.POSE_CONNECTIONS||[]).forEach(([a,b])=>{if(p[a].visibility>.4&&p[b].visibility>.4){x.beginPath();x.moveTo(p[a].x*W,p[a].y*Hh);x.lineTo(p[b].x*W,p[b].y*Hh);x.stroke()}});
 x.fillStyle="#ffd54a";p.forEach(q=>{if(q.visibility>.4){x.beginPath();x.arc(q.x*W,q.y*Hh,5,0,7);x.fill()}});
 if(paused)return;
 const v=i=>p[i].visibility>.5;
 if(!(v(11)&&v(12)&&v(23)&&v(24))){tip(L("nobody"),1);return}
 const A=180/Math.PI,ms={x:(p[11].x+p[12].x)/2},mh={x:(p[23].x+p[24].x)/2,y:(p[23].y+p[24].y)/2},msy=(p[11].y+p[12].y)/2;
 const tilt=Math.abs(Math.atan2(ms.x-mh.x,mh.y-msy))*A,sw=Math.hypot(p[11].x-p[12].x,p[11].y-p[12].y)||.1;
 let sa=Math.abs(Math.atan2(p[11].y-p[12].y,p[11].x-p[12].x))*A;sa=Math.min(sa,180-sa);
 const ang=(a,b,c)=>{const u=[a.x-b.x,a.y-b.y],w=[c.x-b.x,c.y-b.y];return Math.acos(Math.max(-1,Math.min(1,(u[0]*w[0]+u[1]*w[1])/((Math.hypot(...u)*Math.hypot(...w))||1))))*A};
 const ks=[[23,25,27],[24,26,28]].filter(t=>t.every(v)).map(t=>ang(p[t[0]],p[t[1]],p[t[2]]));
 const seat=plan().m=="seat",knee=ks.length&&!seat?Math.min(...ks):null,cog=!seat&&v(27)&&v(28)?Math.abs(mh.x-(p[27].x+p[28].x)/2)/sw:null;
 /* 跌倒风险：倾斜角 / 身体横置 / 髋部骤降 */
 const now=performance.now();let drop=0;if(ph&&now>ph.t)drop=(mh.y-ph.y)/((now-ph.t)/1000);ph={y:mh.y,t:now};
 const xs=p.map(q=>q.x),ys=p.map(q=>q.y),bw=Math.max(...xs)-Math.min(...xs),bh=Math.max(...ys)-Math.min(...ys);
 const risk=Math.min(100,Math.round(tilt*2+(cog||0)*50+sa*1.5));
 $("rk").style.width=risk+"%";$("rkt").textContent=risk+"%";
 fc=(tilt>35||((v(27)||v(28))&&bw>bh*1.15)||drop>.8)?fc+1:0;
 if(fc>=4){fall();return}
 const w=[];if(tilt>12)w.push("w_tilt");if(knee!=null&&knee<80)w.push("w_knee");if(sa>8)w.push("w_sh");if(cog!=null&&cog>.45)w.push("w_cog");
 tile(1,tilt.toFixed(0)+"°",tilt>12);tile(2,knee!=null?knee.toFixed(0)+"°":"--",knee!=null&&knee<80);
 tile(3,sa.toFixed(0)+"°",sa>8);tile(4,cog!=null?cog.toFixed(2):"--",cog!=null&&cog>.45);
 tip(w.length?w.map(L).join(" · "):L("good"),w.length);
}
async function loop(){if(!run)return;if($("vid").readyState>=2){try{await pose.send({image:$("vid")})}catch(e){}}requestAnimationFrame(loop)}
function micMeter(s){try{const a=new(window.AudioContext||webkitAudioContext)(),n=a.createAnalyser();a.createMediaStreamSource(s).connect(n);const d=new Uint8Array(n.fftSize);
 (function f(){if(!run)return;n.getByteTimeDomainData(d);let m=0;d.forEach(q=>m=Math.max(m,Math.abs(q-128)));$("mic").style.width=Math.min(100,m*1.6)+"%";requestAnimationFrame(f)})()}catch(e){}}
function voice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return;
 SR=new R();SR.continuous=true;SR.lang=["zh-CN","en-US","ko-KR"][li];
 SR.onresult=e=>{const t=e.results[e.results.length-1][0].transcript.toLowerCase();if(/救命|help|도와/.test(t))fall();else if(/暂停|pause|멈춰|정지/.test(t)){paused=1;upd()}};
 SR.onend=()=>{if(run)try{SR.start()}catch(e){}};try{SR.start()}catch(e){}}
async function start(){
 if(run)return;const pl=plan();if(pl.m=="ban"){alert(L("m_ban"));return}
 if(!window.Pose){tip(L("liberr"),1);return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:640,height:480},audio:true})}catch(e){tip(L("camerr"),1);return}
 const vid=$("vid");vid.srcObject=stream;await vid.play();tip(L("load"));
 if(!pose){pose=new Pose({locateFile:f=>"https://cdn.jsdelivr.net/npm/@mediapipe/pose/"+f});
  pose.setOptions({modelComplexity:1,smoothLandmarks:true,minDetectionConfidence:.5,minTrackingConfidence:.5});pose.onResults(onRes)}
 run=1;paused=0;sec=0;fc=0;ph=null;$("fb").style.display="none";$("po").style.display="none";upd();micMeter(stream);voice();loop();
 clearInterval(tm);tm=setInterval(()=>{if(run&&!paused){sec++;$("el").textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")+" / "+tgt+":00"}},1000);
}
function fin(){if(!run)return;run=0;clearInterval(tm);stream.getTracks().forEach(t=>t.stop());try{SR&&SR.stop()}catch(e){}$("po").style.display="block"}

/* 4 打卡 */
function sv(){RC.push({d:dt(0),m:+(sec/60).toFixed(1),c:Math.min(100,Math.round(sec/60/tgt*100)),pre:[+$("p_s").value,+$("p_d").value],post:[+$("q_s").value,+$("q_d").value],r:0});
 $("po").style.display="none";sec=0;$("el").textContent="0:00";all();go(3)}
const tb=dr=>`<table><tr><th>${L("c_date")}</th><th>${L("c_dur")}</th><th>${L("c_comp")}</th><th>${L("c_pre")}</th><th>${L("c_post")}</th><th>${L("c_sync")}</th></tr>${RC.map((r,i)=>`<tr><td>${r.d}</td><td>${r.m}</td><td>${r.c}%</td><td>${r.pre.join("/")}</td><td>${r.post.join("/")}</td><td>${dr?(r.r?"✔ "+L("reviewed"):`<button onclick="RC[${i}].r=1;all()">${L("d_rev")}</button>`):"✔ "+L("synced")}</td></tr>`).join("")}</table>`;

/* 7 图谱 */
function ch(id,ss,cs,lb){const c=$(id);if(!c.clientWidth)return;
 const w=c.width=c.clientWidth*2,h=c.height=260,x=c.getContext("2d"),a=ss.flat(),mn=Math.min(...a)-2,mx=Math.max(...a)+2,
 X=i=>70+i*(w-100)/Math.max(1,lb.length-1),Y=v=>h-40-(v-mn)/(mx-mn)*(h-70);
 x.font="22px sans-serif";x.fillStyle="#0b2e5a";x.strokeStyle="#9bc";x.lineWidth=2;x.beginPath();x.moveTo(60,10);x.lineTo(60,h-35);x.lineTo(w-10,h-35);x.stroke();
 x.fillText(Math.round(mx),4,24);x.fillText(Math.round(mn),4,h-38);lb.forEach((t,i)=>x.fillText(t,X(i)-28,h-8));
 ss.forEach((s,k)=>{x.strokeStyle=x.fillStyle=cs[k];x.lineWidth=4;x.beginPath();s.forEach((q,i)=>i?x.lineTo(X(i),Y(q)):x.moveTo(X(i),Y(q)));x.stroke();s.forEach((q,i)=>{x.beginPath();x.arc(X(i),Y(q),6,0,7);x.fill()})})}
function rCh(){const R=RC.slice(-8),Hs=H.slice(-8);
 ch("c1",[R.map(r=>r.pre[0]),R.map(r=>r.post[0])],["#d32f2f","#0e9fb5"],R.map(r=>r.d));
 ch("c2",[Hs.map(q=>q.g)],["#0b2e5a"],Hs.map(q=>q.d));ch("c3",[Hs.map(q=>q.b)],["#1b8a4b"],Hs.map(q=>q.d))}

/* 8 医师后台 */
function rDr(){$("dr").innerHTML=`<p><b>${L("d_pt")}</b><br>${L("lvl")}: ${LV()} · ${L("fl")}: ${S.f} · ${L("d_src")}: ${L(S.src?"src_dr":"src_ai")}</p><h3>${L("d_rx")}</h3>`+
 rx.map((r,i)=>`<div class="g"><b>${D.p[li][i]}</b><input type="number" id="dm${i}" value="${r.m}"><select id="di${i}">${D.int[li].map((t,j)=>`<option value="${j}"${j==r.i?" selected":""}>${t}</option>`).join("")}</select></div>`).join("")+
 `<label>${L("d_note")}<textarea id="dn">${esc(S.note)}</textarea></label><p><button onclick="dsv()">${L("d_save")}</button></p><h3>${L("d_all")}</h3>`+tb(1)}
function dsv(){rx.forEach((r,i)=>{r.m=+$("dm"+i).value;r.i=+$("di"+i).value});S.note=$("dn").value;S.src=1;all()}

/* 9 科普 */
function rK(){$("kb").innerHTML=D.kt[li].map((t,i)=>`<details ${i?"":"open"}><summary>${t}</summary><p>${D.kb[li][i]}</p></details>`).join("")}

function all(){
 document.documentElement.lang=["zh","en","ko"][li];document.title=L("title");
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=L(e.dataset.i));
 document.querySelectorAll(".lg button").forEach((b,j)=>b.classList.toggle("on",j==li));
 const v=$("ex").value||0;$("ex").innerHTML=D.p[li].map((t,i)=>`<option value="${i}">${t}</option>`).join("");$("ex").value=v;
 rNav();rAres();rPlan();rRx();$("rc").innerHTML=tb(0);rDr();rCh();rK();upd();
 if(!run)tip(L("good"));
}
assess(1);
</script></body></html>
